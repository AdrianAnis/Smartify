services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: smartify-web:latest
    container_name: smartify-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3060:3000"
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    container_name: smartify-tunnel
    restart: unless-stopped
    network_mode: host
    user: "${TUNNEL_USER:?Isi TUNNEL_USER di file .env}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${HOME}/.cloudflared-smartify:/etc/cloudflared:ro
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
